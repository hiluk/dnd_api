services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dnd_api
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "5000:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=dnd_db;Username=${POSTGRES_USER:-dnd};Password=${POSTGRES_PASSWORD:-dnd}
      Avatars__Path: /data/avatars
    volumes:
      - avatars:/data/avatars
    restart: unless-stopped

  postgres:
    image: postgres:16
    container_name: dnd_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dnd}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dnd}
      POSTGRES_DB: dnd_db
    volumes:
      - postgres:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d dnd_db"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  postgres:
  avatars:
